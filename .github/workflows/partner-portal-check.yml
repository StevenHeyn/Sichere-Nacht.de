name: Partner portal isolation and build
on:
  pull_request:
    branches: [main, feature/partner-portal-v1]
  push:
    branches: [fix/vp-phase1-build-isolation-20261119]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: partner-portal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  partner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: partner-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: partner-portal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
