name: SECPLAN dropshipping safeguards
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'app/**'
      - 'database/secplan_dropship.sql'
      - 'scripts/secplan-dropship-test.mjs'
      - 'scripts/secplan-portal-test.mjs'
      - '.github/workflows/secplan-dropship-check.yml'
permissions:
  contents: read
concurrency:
  group: secplan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dropship policy and data-minimization tests (no network or secrets)
        run: node --experimental-strip-types --test scripts/secplan-dropship-test.mjs scripts/secplan-portal-test.mjs
      - name: Install build dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Existing launch safeguards
        run: node scripts/go-live-audit.mjs
      - name: Next.js production build
        run: npm run build
