name: SECPLAN dropshipping safeguards
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'app/**'
      - 'database/secplan_dropship.sql'
      - 'scripts/secplan-dropship-test.mjs'
      - '.github/workflows/secplan-dropship-check.yml'
permissions:
  contents: read
concurrency:
  group: secplan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dropship policy and data-minimization tests (no network or secrets)
        run: node --experimental-strip-types --test scripts/secplan-dropship-test.mjs scripts/secplan-portal-test.mjs scripts/supplier-visibility-test.mjs
      - name: Install build dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Existing launch safeguards
        run: node scripts/go-live-audit.mjs
      - name: Next.js production build
        run: npm run build
      - name: Verify production browser bundles are supplier-neutral
        run: node --experimental-strip-types scripts/supplier-visibility-test.mjs --built
      - name: Verify public pages and protected supplier endpoint without real secrets
        run: |
          ORDERS_ADMIN_TOKEN=LOCAL-QA-SUPPLIER-ONLY npm run start -- -p 3100 > /tmp/supplier-server.log 2>&1 &
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:3100 >/dev/null && break || sleep 1; done
          node scripts/supplier-http-qa.mjs
